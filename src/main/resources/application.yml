spring:
  application:
    name: reminderApp
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SENDER_EMAIL}
    password: ${SENDER_EMIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}

  notification:
    email:
      enabled: true
      from: sender-email@mail.com # This shit set incorrectly but it somehow works (And does not work without it)

    telegram:
      enabled: true
      bot-token: ${TELEGRAM_BOT_TOKEN}
      bot-username: java_reminder_app_bot

logging:
  level:
    org.springframework.security: DEBUG
    com.reminderapp.reminder: DEBUG
    org.quartz: INFO