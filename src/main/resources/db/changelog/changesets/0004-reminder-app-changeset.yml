databaseChangeLog:
  - changeSet:
      id: 0004
      author: Main_user
      changes:
        - createTable:
            tableName: reminders
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: title
                  type: VARCHAR(255)

              - column:
                  name: description
                  type: varchar(4096)

              - column:
                  name: remind
                  type: datetime

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: user_id_fk
                    references: users(id)
