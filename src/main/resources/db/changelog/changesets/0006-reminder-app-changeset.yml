databaseChangeLog:
  - changeSet:
      id: 0006
      author: Main_user
      changes:
        - dropForeignKeyConstraint:
            baseTableName: reminders
            constraintName: user_id_fk

        - addForeignKeyConstraint:
            baseTableName: reminders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: user_id_fk
            onDelete: CASCADE