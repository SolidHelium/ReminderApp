databaseChangeLog:
  - changeSet:
      id: 0001
      author: Main_user (generated)
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

