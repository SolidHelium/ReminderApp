spring:
  config:
    activate:
      on-profile: test

  liquibase:
    enabled: false

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  quartz:
    job-store-type: memory

app:
  jwt:
    secret: ${JWT_SECRET:dummy-fake-super-secret-key-that-is-at-least-256-bits-for-testing}